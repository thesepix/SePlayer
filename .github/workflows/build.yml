name: Binaries bauen

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (.exe)
            os: windows-latest
            artifact: SePlayer.exe
            path: dist/SePlayer.exe
          - name: macOS (.dmg)
            os: macos-latest
            artifact: SePlayer.dmg
            path: dist/SePlayer.dmg
          - name: Linux (x86_64)
            os: ubuntu-22.04
            artifact: SePlayer-linux-x86_64
            path: dist/SePlayer-linux-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt
      - name: PyInstaller ausfuehren
        run: pyinstaller se_player.spec --noconfirm --clean
      - name: macOS -> DMG packen
        if: runner.os == 'macOS'
        run: hdiutil create -volname SePlayer -srcfolder dist/SePlayer.app -ov -format UDZO dist/SePlayer.dmg
      - name: Linux -> Dateiname setzen
        if: runner.os == 'Linux'
        run: |
          cp dist/SePlayer dist/SePlayer-linux-x86_64
          chmod +x dist/SePlayer-linux-x86_64
      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
      - name: Release erstellen (nur bei Tag v*)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.path }}
