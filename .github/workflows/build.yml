name: Binaries bauen

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (.exe)
            os: windows-latest
            artifact: SePlayer.exe
            path: dist/SePlayer.exe
          - name: macOS (.dmg)
            os: macos-latest
            artifact: SePlayer.dmg
            path: dist/SePlayer.dmg
          - name: Linux (x86_64)
            os: ubuntu-22.04
            artifact: SePlayer-linux-x86_64
            path: dist/SePlayer-linux-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt
      - name: PyInstaller ausfuehren
        run: pyinstaller se_player.spec --noconfirm --clean
      - name: macOS -> ad-hoc signieren & DMG packen (mit Applications-Link)
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - dist/SePlayer.app
          rm -rf /tmp/dmg && mkdir -p /tmp/dmg
          cp -R dist/SePlayer.app /tmp/dmg/
          ln -s /Applications /tmp/dmg/Applications
          hdiutil create -volname SePlayer -srcfolder /tmp/dmg -ov -format UDZO dist/SePlayer.dmg
      - name: Linux -> Dateiname setzen
        if: runner.os == 'Linux'
        run: |
          cp dist/SePlayer dist/SePlayer-linux-x86_64
          chmod +x dist/SePlayer-linux-x86_64
      - name: Datei mit Version versehen (Tag-Name bzw. dev-<sha>)
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then VER="${{ github.ref_name }}"; else VER="dev-${{ github.short_ref }}"; fi
          case "${{ matrix.os }}" in
            windows-latest) OUT="dist/SePlayer-${VER}.exe" ;;
            macos-latest)   OUT="dist/SePlayer-${VER}.dmg" ;;
            *)              OUT="dist/SePlayer-linux-${VER}" ;;
          esac
          cp "${{ matrix.path }}" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
      - name: Artefakt hochladen (Quota-sicher: kurz behalten, nie kritisch)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: SePlayer-${{ steps.ver.outputs.ver }}
          path: ${{ steps.ver.outputs.path }}
          retention-days: 3
      - name: Release erstellen (nur bei Tag v*)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.ver.outputs.path }}
